spring:
  application:
    name: ttuk
  profiles:
    active: local
  docker:
    compose:
      enabled: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
  session:
    timeout: 30m
    data:
      redis:
        repository-type: indexed