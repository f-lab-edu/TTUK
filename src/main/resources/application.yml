spring:
  application:
    name: ttuk
  profiles:
    active: local
  docker:
    compose:
      enabled: false
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
  session:
    timeout: 30m
    data:
      redis:
        repository-type: indexed
  sql:
    init:
      mode: always
      encoding: UTF-8
  cache:
    type: redis
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 31MB

ttuk:
  s3:
    bucket: ttuk-images-bucket
    region: ap-northeast-2
    public-base-url: https://ttuk-images-bucket.s3.ap-northeast-2.amazonaws.com