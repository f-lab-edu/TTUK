spring:
  application:
    name: ttuk
  profiles:
    active: local
  docker:
    compose:
      enabled: false
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
  session:
    timeout: 30m
    data:
      redis:
        repository-type: indexed
  sql:
    init:
      mode: always
      encoding: UTF-8
  cache:
    type: redis